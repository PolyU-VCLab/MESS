      - accelerate
      - xformers>=0.0.20

      # Image processing
      - pillow>=9.5.0
      - opencv-python==4.6.0.66
      - numpy>=1.24.4

      # Degradation pipeline (RealESRGAN)
      - basicsr

      # Experiment tracking
      - wandb

      # Misc
      - tqdm>=4.65.0
