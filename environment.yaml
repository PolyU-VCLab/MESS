name: img2img-turbo
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip:
      # Core deep learning
      - torch>=2.0.1
      - torchvision>=0.15.2
      - torchaudio>=2.0.2

      # Diffusion / model
      - diffusers==0.25.1
      - transformers==4.35.2
